# Test build of the desktop app (no release): runs when desktop code changes on a branch, and
# attaches the Windows installer and the Mac .dmg to the run under "Artifacts". A new branch
# pushed with nothing changed from main doesn't count as changing those paths, so either commit
# to it or start the build by hand (Actions → Desktop build → Run workflow).
name: Desktop build

on:
  push:
    branches-ignore: [main]
    paths: ['src-tauri/**', 'app/**', 'components/**', 'lib/**', 'scripts/**', 'desktop/**', 'package*.json', 'next.config.ts', '.github/workflows/desktop-build.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Update signing needs the release key; test builds skip it (a config file, since inline JSON
      # doesn't survive PowerShell's quoting)
      - run: npx tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: flashcards-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # One app for Apple Silicon and Intel
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.ci.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: flashcards-mac-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
