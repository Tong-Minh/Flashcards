# Test build of the desktop app (no release): runs when desktop code changes on a branch, and
# attaches the Windows installer to the run under "Artifacts".
name: Desktop build

on:
  push:
    branches-ignore: [main]
    paths: ['src-tauri/**', 'app/**', 'components/**', 'lib/**', 'package*.json', 'next.config.ts', '.github/workflows/desktop-build.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Update signing needs the release key; test builds skip it
      - run: npx tauri build --bundles nsis --config "{\"bundle\":{\"createUpdaterArtifacts\":false}}"

      - uses: actions/upload-artifact@v4
        with:
          name: flashcards-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
