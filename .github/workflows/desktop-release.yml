# Builds the Windows and Mac desktop apps and publishes them it as a GitHub Release when a version tag is pushed
# (e.g. `npm version patch` then `git push --follow-tags`). The installed app checks the latest
# release's latest.json and offers the update.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Runs `npm run build:desktop` (tauri.conf.json beforeBuildCommand), bundles the installers,
      # signs the update, and uploads everything plus latest.json to the release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Flashcards ${{ github.ref_name }}
          releaseBody: "Windows: download the `_x64-setup.exe` file below and run it. Mac: download the `.dmg`, drag Flashcards into Applications and open it. The first time, macOS blocks it: go to System Settings → Privacy & Security and click Open Anyway. Already installed? The app offers this update when it starts."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

  # One build for Apple Silicon and Intel. It runs after Windows so the two jobs never rewrite
  # latest.json at once (each merges its platforms into the one already on the release).
  # Unsigned (ad-hoc, see tauri.macos.conf.json): macOS asks to allow it once, then updates just work.
  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Flashcards ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
