[package]
name = "flashcards"
version = "0.1.2"
description = "Flashcards desktop app"
edition = "2021"

[lib]
name = "flashcards_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# FSRS parameter optimization (the same fsrs-rs version as the web's fsrs-browser)
fsrs = "6.6"

# Uninstalling on a Mac moves the app to the Trash
[target.'cfg(target_os = "macos")'.dependencies]
trash = "5"
